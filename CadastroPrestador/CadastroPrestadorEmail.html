<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    <link rel="stylesheet" href="CadastroPrestador.css">
</head>
<body>

    <div class="container">
        <!-- Lado Esquerdo: Logo BICO -->
        <div class="logo-section">
            <img src="../Icones/bico_icone.png" alt="Logo BICO">
        </div>

        <!-- Lado Direito: Card do Formulário -->
        <div class="card">
            <h2 class="card-title">Informe seu e-mail e senha</h2>
            
            <div class="input-group">
                <input id="email" type="email" class="form-input" placeholder="Email">
                <input id="senha" type="password" class="form-input" placeholder="Senha">
                <input id="confSenha" type="password" class="form-input" placeholder="Confirmar Senha">
            </div>

            <div class="button-group">
                <button id="btnAvancar" type="button" class="btn btn-primary">Avançar</button>
                <button id="btnVoltar" type="button" class="btn btn-secondary">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        // Botões
        const avancar = document.getElementById("btnAvancar");
        const voltar = document.getElementById("btnVoltar");

        // Inputs
        const email = document.getElementById("email");
        const senha = document.getElementById("senha");
        const confSenha = document.getElementById("confSenha");

        avancar.addEventListener("click", function () {
            if (!email.value) {
                alert("Insira um e-mail!");
            } else {
                if (!senha.value) {
                    alert("Insira uma senha!");
                } else {
                    if (confSenha.value !== senha.value) {
                        alert("As senhas não coincidem!");
                    } else {
                        try {
                            window.location.href = "../Login/Login.html";
                        } catch (erro) {
                            console.error("Erro ao tentar redirecionar:", erro);
                        }
                    }
                }
            }
        });
        
        voltar.addEventListener("click", function () {
            try {
                window.location.href = "CadastroPrestadorLocal.html";
            } catch (erro) {
                console.error("Erro ao tentar redirecionar:", erro);
            }
        });

    </script>

</body>
</html>
