<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    <link rel="stylesheet" href="CadastroPrestador.css">
</head>
<body>

    <div class="container">
        <!-- Lado Esquerdo: Logo BICO -->
        <div class="logo-section">
            <img src="../Icones/bico_icone.png" alt="Logo BICO">
        </div>

        <!-- Lado Direito: Card do Formulário -->
        <div class="card">
            <h2 class="card-title">Nos diga seu nome</h2>
            
            <div class="input-group">
                <input id="nomeCompleto" type="text" class="form-input" placeholder="Nome Completo">
                <input id="cpf" type="text" class="form-input" placeholder="CPF">
            </div>

            <div class="button-group">
                <button id="btnAvancar" type="button" class="btn btn-primary">Avançar</button>
                <button id="btnVoltar" type="button" class="btn btn-secondary">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        // Botões
        const avancar = document.getElementById("btnAvancar");
        const voltar = document.getElementById("btnVoltar");

        // Inputs
        const nomeCompleto = document.getElementById("nomeCompleto");
        const cpf = document.getElementById("cpf");

        // Evento de Avançar com Validação
        avancar.addEventListener("click", function () {
            if (!nomeCompleto.value) {
                alert("Insira seu nome completo!");
            } else {
                if (!cpf.value) {
                    alert("Insira seu CPF!");
                } else {
                    try {
                        window.location.href = "CadastroPrestadorUsuario.html";
                    } catch (erro) {
                        console.error("Erro ao tentar redirecionar:", erro);
                    }
                }
            }
        });
        
        // Evento de Voltar
        voltar.addEventListener("click", function () {
            try {
                window.location.href = "../Login/Login.html";
            } catch (erro) {
                console.error("Erro ao tentar redirecionar:", erro);
            }
        });

    </script>

</body>
</html>
