<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CadastroPrestador.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">

    <main class="container">
        <!-- Linha do Grid Bootstrap -->
        <div class="row align-items-center justify-content-center g-4">
            
            <!-- Lado Esquerdo: Logo BICO -->
            <div class="col-12 col-lg-6 d-flex justify-content-center">
                <div class="logo-section">
                    <img src="../Icones/bico_icone.png" alt="Logo BICO" class="img-fluid d-block">
                </div>
            </div>

            <!-- Lado Direito: Card do Formulário -->
            <div class="col-12 col-lg-6 d-flex justify-content-center">
                <div class="card card-custom border-0 p-4 p-sm-5">
                    <h2 class="card-title text-center mb-4 pb-2">Nos diga seu serviço e onde trabalha</h2>
                    
                    <form id="formCadastro">
                        <div class="d-flex flex-column gap-4 mb-5">
                            <input id="servico" type="text" class="form-control form-input" placeholder="Tipo de Serviço">
                            <input id="local" type="text" class="form-control form-input" placeholder="Local de Atuação">
                        </div>

                        <div class="d-grid gap-3">
                            <button id="btnAvancar" type="button" class="btn btn-primary-custom py-3">Avançar</button>
                            <button id="btnVoltar" type="button" class="btn btn-secondary-custom py-3">Voltar</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Botões
        const avancar = document.getElementById("btnAvancar");
        const voltar = document.getElementById("btnVoltar");

        // Inputs
        const servico = document.getElementById("servico");
        const local = document.getElementById("local");

        avancar.addEventListener("click", function () {
            if (!servico.value) {
                alert("Insira o tipo de serviço!");
            } else {
                if (!local.value) {
                    alert("Insira o local de atuação!");
                } else {
                    try {
                        window.location.href = "CadastroPrestadorEmail.html"; // Redireciona para a próxima etapa
                    } catch (erro) {
                        console.error("Erro ao tentar redirecionar:", erro);
                    }
                }
            }
        });

        voltar.addEventListener("click", function () {
            try {
                window.location.href = "CadastroPrestadorUsuario.html"; // Redireciona para a etapa anterior
            } catch (erro) {
                console.error("Erro ao tentar redirecionar:", erro);
            }
        });
    </script>

</body>
</html>
