<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f4f4f6;
            min-height: 100vh;
            display: grid;
            place-items: center; /* Centraliza o container inteiro na tela */
            padding: 20px;
        }

        /* Container Principal ajustado para 90% da tela */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Duas colunas iguais */
            align-items: center;   /* Centraliza verticalmente cada lado */
            justify-items: center; /* Centraliza horizontalmente dentro do seu lado */
            gap: 40px;
            width: 90%; /* 90% da largura da tela */
        }

        /* Logo e Ilustração (Lado Esquerdo) - Mantido em 620px */
        .logo-section {
            display: grid;
            place-items: center;
            width: 100%;
            max-width: 620px; /* Mantido exatamente em 620px */
        }

        .logo-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Card do Formulário - Um pouco maior, mas mantendo o formato retangular "em pé" */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 56px 44px; /* Espaçamento interno aumentado */
            width: 100%;
            max-width: 440px;   /* Aumentado de 380px para 440px mantendo a proporção vertical */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card-title {
            color: #252e3e;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 48px;
        }

        /* Campos de Entrada com Grid */
        .input-group {
            display: grid;
            gap: 32px;
            margin-bottom: 52px;
        }

        .form-input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #d1d5db;
            padding: 10px 0;
            font-size: 15px;
            color: #252e3e;
            outline: none;
            background: transparent;
            transition: border-color 0.2s ease;
        }

        .form-input::placeholder {
            color: #8e98a8;
            font-size: 14px;
        }

        .form-input:focus {
            border-bottom-color: #252e3e;
        }

        /* Botões com Grid e Efeito de Brilho (Glow) */
        .button-group {
            display: grid;
            gap: 18px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Botão Avançar + Brilho */
        .btn-primary {
            background-color: #252e3e;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(37, 46, 62, 0.45);
        }

        .btn-primary:hover {
            background-color: #1a2230;
            box-shadow: 0 0 25px rgba(37, 46, 62, 0.65);
            transform: translateY(-1px);
        }

        /* Botão Voltar + Brilho */
        .btn-secondary {
            background-color: #e2e8fc;
            color: #252e3e;
            box-shadow: 0 0 18px rgba(180, 200, 255, 0.75);
        }

        .btn-secondary:hover {
            background-color: #d4defa;
            box-shadow: 0 0 25px rgba(160, 188, 255, 0.95);
            transform: translateY(-1px);
        }

        /* Responsividade para celulares */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr; /* Muda para 1 coluna */
                width: 95%;
                gap: 40px;
            }

            .card {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Lado Esquerdo: Logo BICO -->
        <div class="logo-section">
            <img src="bico_icone.png" alt="Logo BICO">
        </div>

        <!-- Lado Direito: Card do Formulário -->
        <div class="card">
            <h2 class="card-title">Nos diga seu nome</h2>
            
            <div class="input-group">
                <input type="text" class="form-input" placeholder="Nome Completo">
                <input type="text" class="form-input" placeholder="CPF">
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-primary">Avançar</button>
                <button type="button" class="btn btn-secondary">Voltar</button>
            </div>
        </div>
    </div>

</body>
</html>
