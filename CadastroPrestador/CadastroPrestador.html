<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f4f4f6;
            min-height: 100vh;
            display: grid;
            place-items: center; /* Centraliza o container inteiro na tela */
            padding: 20px;
        }

        /* Container Principal utilizando CSS Grid */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Duas colunas de tamanhos iguais */
            align-items: center;   /* Centraliza verticalmente o conteúdo de cada lado */
            justify-items: center; /* Centraliza horizontalmente dentro do seu respectivo lado */
            gap: 60px;
            width: 100%;
            max-width: 1000px;
        }

        /* Logo e Ilustração (Lado Esquerdo) */
        .logo-section {
            display: grid;
            place-items: center;
            width: 100%;
            max-width: 320px; /* Limita o tamanho máximo da imagem */
        }

        .logo-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Card do Formulario (Lado Direito) */
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 48px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card-title {
            color: #252e3e;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
        }

        /* Campos de Entrada utilizando Grid */
        .input-group {
            display: grid;
            gap: 24px;
            margin-bottom: 50px;
        }

        .form-input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #d1d5db;
            padding: 8px 0;
            font-size: 14px;
            color: #252e3e;
            outline: none;
            background: transparent;
            transition: border-color 0.2s ease;
        }

        .form-input::placeholder {
            color: #8e98a8;
            font-size: 13.5px;
        }

        .form-input:focus {
            border-bottom-color: #252e3e;
        }

        /* Botões utilizando Grid */
        .button-group {
            display: grid;
            gap: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-primary {
            background-color: #252e3e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 46, 62, 0.2);
        }

        .btn-primary:hover {
            background-color: #1a2230;
        }

        .btn-secondary {
            background-color: #e2e8fc;
            color: #252e3e;
        }

        .btn-secondary:hover {
            background-color: #d4defa;
        }

        /* Responsividade para telas menores */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr; /* Transforma em 1 coluna em telas menores */
                gap: 40px;
            }

            .card {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Lado Esquerdo: Logo BICO -->
        <div class="logo-section">
            <img src="bico_icone.png" alt="Logo BICO">
        </div>

        <!-- Lado Direito: Card do Formulario -->
        <div class="card">
            <h2 class="card-title">Nos diga seu nome</h2>
            
            <div class="input-group">
                <input type="text" class="form-input" placeholder="Nome Completo">
                <input type="text" class="form-input" placeholder="CPF">
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-primary">Avançar</button>
                <button type="button" class="btn btn-secondary">Voltar</button>
            </div>
        </div>
    </div>

</body>
</html>
