<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BICO - Painel do Prestador</title>

    <!-- Links de bootstrap e css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Prestador.css">
    <link rel="stylesheet" href="../Fonts/Design.css">

</head>
<body>

  <!-- CABEÇALHO / HEADER -->
  <header class="header">
    <a class="header-logo" href="PrestadorHome.html" aria-label="BICO - início">
      <img src="../Icones/bico_tucan.png" alt="Logo BICO" class="img-logo">
      <img src="../Icones/bico_logo.png" alt="Logo BICO" class="img-logo">
    </a>

    <!-- CARDS DE ESTATÍSTICAS NO CABEÇALHO -->
    <div class="header-stats">
      <div class="stat-card">
        <span class="stat-number">5</span>
        <span class="stat-label">Pendentes</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">4,7</span>
        <span class="stat-label">Avaliação</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">367</span>
        <span class="stat-label">Concluídos</span>
      </div>
    </div>

    <!-- MENU DE NAVEGAÇÃO -->
    <nav class="header-nav">
      <a href="#" class="nav-link active">Início</a>
      <a href="#" class="nav-link">Mensagens</a>
      <a href="#" class="nav-link">Planos</a>
    </nav>

    <!-- PERFIL DO USUÁRIO -->
    <a class="header-profile" href="PrestadorEditarPerfil.html" id="providerHeaderProfile">
      <img src="../Icones/bico_icone.png" alt="Foto do prestador" class="profile-avatar" id="providerHeaderAvatar">
      <span class="profile-name" id="providerHeaderName">Prestador</span>
    </a>
  </header>

  <!-- CORPO PRINCIPAL DA PÁGINA -->
  <div class="main-layout">

    <!-- BARRA LATERAL COM ÍCONES/VETORES -->
    <aside class="sidebar" aria-label="Atalhos">
            <a href="PrestadorHome.html" class="sidebar-icon active" title="Página inicial" aria-label="Página inicial"><img src="../Icones/HomeLaranja.png" alt="Página Inicial"></a>
            <a href="PrestadorEditarPerfil.html" class="sidebar-icon" title="Editar perfil" aria-label="Editar perfil"><img src="../Icones/UserPreto.png" alt="Editar Perfil"></a>
        </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content-area">

      <!-- SEÇÃO: PRÓXIMOS SERVIÇOS -->
      <section class="section">
        <h2 class="section-title">Próximos Serviços <object type="image/svg+xml" data="../Icones/ic_home.xml"></object></h2>

        <div class="cards-grid">
          
          <!-- CARD DE SERVIÇO 1 -->
          <div class="service-card">
            <!-- COLOQUE AQUI A FOTO DO CLIENTE 1 -->
            <img src="../Icones/Wellington_Matos.jpeg" alt="Ednaldo Pereira" class="client-avatar">
            
            <div class="service-info">
              <div class="service-header-row">
                <h3 class="client-name">Ednaldo Pereira</h3>
                <span class="service-time">
                  <!-- COLOQUE AQUI O ÍCONE DE RELÓGIO (OPCIONAL) OU MANTENHA SÓ O TEXTO/ÍCONE -->
                  <img src="../Icones/ClockLaranja.png" alt="Horário" class="inline-icon">
                  06/07, 06:07
                </span>
              </div>
              
              <p class="service-type">Reparo de disjuntor</p>
              
              <div class="service-footer-row">
                <span class="service-location">
                  <!-- COLOQUE AQUI O ÍCONE DE LOCALIZAÇÃO (PIN) -->
                  <img src="../Icones/PinLaranja.png" alt="Local" class="inline-icon">
                  José de Anchieta - Serra
                </span>
                <button class="btn-concluir">Concluir</button>
              </div>
            </div>
          </div>

          <!-- CARD DE SERVIÇO 2 -->
          <div class="service-card">
            <!-- COLOQUE AQUI A FOTO DA CLIENTE 2 -->
            <img src="../Icones/Wellington_Matos.jpeg" alt="Vânia Silva" class="client-avatar">
            
            <div class="service-info">
              <div class="service-header-row">
                <h3 class="client-name">Vânia Silva</h3>
                <span class="service-time">
                  <!-- COLOQUE AQUI O ÍCONE DE RELÓGIO -->
                  <img src="../Icones/ClockLaranja.png" alt="Horário" class="inline-icon">
                  12/07, 12:00
                </span>
              </div>
              
              <p class="service-type">Instalação de placas solares</p>
              
              <div class="service-footer-row">
                <span class="service-location">
                  <!-- COLOQUE AQUI O ÍCONE DE LOCALIZAÇÃO (PIN) -->
                  <img src="../Icones/PinLaranja.png" alt="Local" class="inline-icon">
                  Morada de Laranjeiras - Serra
                </span>
              </div>
            </div>
          </div>

        </div>
      </section>

      <!-- SEÇÃO: AÇÕES RÁPIDAS -->
      <section class="section">
        <h2 class="section-title">Ações Rápidas</h2>

        <div class="quick-actions-grid">
          <div class="action-card">
            <!-- COLOQUE AQUI O ÍCONE DE AGENDA/CALENDÁRIO -->
            <img src="../Icones/CalendarioLaranja.png" alt="Agenda" class="action-icon">
            <span class="action-text">Agenda</span>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script type="module">
    import { api } from "../API/apiService.js";
    import { auth } from "../API/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const fallbackAvatar = "../Icones/bico_icone.png";
    const avatar = document.querySelector("#providerHeaderAvatar");
    const name = document.querySelector("#providerHeaderName");

    avatar.addEventListener("error", () => {
      if (!avatar.dataset.fallbackApplied) {
        avatar.dataset.fallbackApplied = "true";
        avatar.src = fallbackAvatar;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        return;
      }

      try {
        const token = await user.getIdToken();
        const profile = await api.buscarPrestador(token);
        const profileName = profile?.nome || profile?.username || "Prestador";
        name.textContent = profileName;
        avatar.alt = `Foto de ${profileName}`;
        avatar.src = profile?.fotoPerfil || profile?.fotoPaginaPerfil || fallbackAvatar;
      } catch (_) {
        name.textContent = "Prestador";
        avatar.src = fallbackAvatar;
      }
    });
  </script>
</body>
</html>
