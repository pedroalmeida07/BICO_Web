<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BICO - Painel do Prestador</title>

    <!-- Links de bootstrap e css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Prestador.css">
    <link rel="stylesheet" href="../Fonts/Design.css">

</head>
<body>

  <!-- CABEÇALHO / HEADER -->
  <header class="header">
    <a class="header-logo" href="PrestadorHome.html" aria-label="BICO - início">
      <img src="../Icones/bico_tucan.png" alt="Logo BICO" class="img-logo">
      <img src="../Icones/bico_logo.png" alt="Logo BICO" class="img-logo">
    </a>

    <!-- MENU DE NAVEGAÇÃO -->
    <nav class="header-nav">
      <a href="#" class="nav-link active">Início</a>
      <a href="#" class="nav-link">Mensagens</a>
    </nav>

    <!-- PERFIL DO USUÁRIO -->
    <a class="header-profile" href="PrestadorEditarPerfil.html" id="providerHeaderProfile">
      <img src="../Icones/bico_icone.png" alt="Foto do prestador" class="profile-avatar" id="providerHeaderAvatar">
      <span class="profile-name" id="providerHeaderName">Prestador</span>
    </a>
  </header>

  <!-- CORPO PRINCIPAL DA PÁGINA -->
  <div class="main-layout">

    <!-- BARRA LATERAL COM ÍCONES/VETORES -->
    <aside class="sidebar" aria-label="Atalhos">
            <a href="PrestadorHome.html" class="sidebar-icon active" title="Página inicial" aria-label="Página inicial"><img src="../Icones/HomeLaranja.png" alt="Página Inicial"></a>
            <a href="PrestadorEditarPerfil.html" class="sidebar-icon" title="Editar perfil" aria-label="Editar perfil"><img src="../Icones/UserPreto.png" alt="Editar Perfil"></a>
        </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content-area">

      <section class="account-rating" aria-label="Avaliações da conta">
        <div class="account-rating-card">
          <span class="account-rating-label">Nota Média</span>
          <span class="account-rating-value" id="providerAverageRating">—</span>
        </div>
        <div class="account-rating-card">
          <span class="account-rating-label">Total de Avaliações</span>
          <span class="account-review-count" id="providerReviewCount">—</span>
        </div>
      </section>

    </main>
  </div>

  <script type="module">
    import { api } from "../API/apiService.js";
    import { auth } from "../API/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const fallbackAvatar = "../Icones/bico_icone.png";
    const avatar = document.querySelector("#providerHeaderAvatar");
    const name = document.querySelector("#providerHeaderName");
    const averageRating = document.querySelector("#providerAverageRating");
    const reviewCount = document.querySelector("#providerReviewCount");

    avatar.addEventListener("error", () => {
      if (!avatar.dataset.fallbackApplied) {
        avatar.dataset.fallbackApplied = "true";
        avatar.src = fallbackAvatar;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        return;
      }

      try {
        const token = await user.getIdToken();
        const profile = await api.buscarPrestador(token);
        const profileName = profile?.nome || profile?.username || "Prestador";
        const rating = Number(profile?.notaMedia);
        const reviews = Array.isArray(profile?.avaliacoes) ? profile.avaliacoes : [];
        name.textContent = profileName;
        avatar.alt = `Foto de ${profileName}`;
        avatar.src = profile?.fotoPerfil || profile?.fotoPaginaPerfil || fallbackAvatar;
        averageRating.textContent = `${Number.isFinite(rating) ? rating.toFixed(1) : "0.0"} ★`;
        reviewCount.textContent = String(reviews.length);
      } catch (error) {
        name.textContent = "Prestador";
        avatar.src = fallbackAvatar;
        averageRating.textContent = "—";
        reviewCount.textContent = "—";
        console.error("Não foi possível carregar os dados do prestador.", error);
      }
    });
  </script>
</body>
</html>
