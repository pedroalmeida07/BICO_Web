<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Editar perfil</title>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Cliente.css">

    <style>
        /* ÁREA CENTRAL DE CONTEÚDO */
        .content-area {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .profile-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CARD BANNER SUPERIOR */
        .user-card {
            background-color: #d9d9d9;
            width: 100%;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar-circle {
            width: 55px;
            height: 55px;
            background-color: #666666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d9d9d9;
            font-size: 36px;
        }

        .user-title {
            font-size: 17px;
            font-weight: bold;
            color: #000;
        }

        .btn-mudar-foto {
            background-color: #e08b35;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        /* FORMULÁRIO */
        .edit-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .form-group label {
            font-size: 12px;
            color: #222;
            padding-left: 4px;
        }

        .input-box {
            position: relative;
            width: 100%;
        }

        .input-box input {
            width: 100%;
            padding: 8px 45px 8px 16px;
            border-radius: 18px;
            border: 1px solid #555;
            background-color: #fff;
            font-size: 13px;
            outline: none;
            color: #333;
        }

        .input-icons {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            color: #000;
            font-size: 13px;
        }

        /* BOTÃO SALVAR */
        .btn-salvar-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-salvar,
        .btn-logout {
            background-color: #233044;
            color: #fff;
            border: none;
            padding: 10px 12px;
            width: 140px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-logout {
            background-color: #dc3545;
        }

        .btn-salvar:disabled,
        .btn-logout:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        #profileMessage {
            width: 100%;
            font-size: 13px;
        }
    </style>
    <link rel="stylesheet" href="../Fonts/Design.css">
</head>
<body>

    <!-- Header / Barra Superior -->
    <header class="header">
        <a class="header-logo" href="ClienteHome.html" aria-label="BICO - início">
            <img src="../Icones/bico_tucan.png" alt="" class="logo-tucano">
            <img src="../Icones/bico_logo.png" alt="BICO" class="logo-nome">
        </a>

        <form class="search-form" role="search" action="ClienteHome.html" method="get">
            <input type="search" name="termo" placeholder="Pesquisar um serviço ou prestador">
            <button type="submit"><i class="bi bi-search"></i></button>
        </form>

        <nav class="header-nav">
            <a href="ClienteHome.html" class="nav-link">Início</a>
            <a href="#mensagens" class="nav-link">Mensagens</a>
        </nav>

        <a class="header-profile" href="ClienteEditarPerfil.html">
            <img src="../Icones/bico_icone.png" alt="Foto do cliente" class="profile-avatar" id="clientHeaderAvatar">
            <span class="profile-name" id="clientHeaderName">Carregando...</span>
        </a>
    </header>

    <div class="main-layout">
        <aside class="sidebar" aria-label="Atalhos">
            <a href="ClienteHome.html" class="sidebar-icon" title="Página inicial" aria-label="Página inicial"><img src="../Icones/HomeLaranja.png" alt="Página Inicial"></a>
            <a href="#perfil" class="sidebar-icon active" title="Editar perfil" aria-label="Editar perfil"><img src="../Icones/UserPreto.png" alt="Editar Perfil"></a>
            <a href="ClienteHome.html#favoritos" class="sidebar-icon" title="Favoritos" aria-label="Favoritos"><img src="../Icones/StarPreto.png" alt="Favoritos"></a>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="content-area">
            <div class="profile-wrapper">
                
                <!-- Card Superior -->
                <div class="user-card">
                    <div class="user-info">
                        <img id="clientProfileAvatar" src="../Icones/bico_icone.png" alt="Foto do cliente" class="user-avatar-circle" style="object-fit: cover;">
                        <span class="user-title" id="clientProfileName">Carregando perfil...</span>
                    </div>
                    <button class="btn-mudar-foto" id="changePhotoButton" type="button" disabled>Mudar foto</button>
                    <input id="clientPhotoInput" type="file" accept="image/*" hidden>
                </div>

                <!-- Formulário de Edição -->
                <form class="edit-form">
                    <p id="profileMessage" role="status" aria-live="polite" hidden></p>
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <div class="input-box">
                            <input type="text" id="nome" autocomplete="name" disabled>
                            <div class="input-icons"><i class="bi bi-pencil-fill"></i></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <div class="input-box">
                            <input type="email" id="email" autocomplete="email" disabled aria-describedby="emailHelp">
                            <div class="input-icons"><i class="bi bi-pencil-fill"></i></div>
                        </div>
                        <small id="emailHelp">O e-mail é gerenciado pela autenticação da conta.</small>
                    </div>

                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <div class="input-box">
                            <input type="text" id="cep" autocomplete="postal-code" disabled>
                            <div class="input-icons"><i class="bi bi-pencil-fill"></i></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="numero">Número</label>
                        <div class="input-box">
                            <input type="text" id="numero" disabled>
                            <div class="input-icons"><i class="bi bi-pencil-fill"></i></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="complemento">Complemento</label>
                        <div class="input-box">
                            <input type="text" id="complemento" autocomplete="address-line2" disabled>
                            <div class="input-icons"><i class="bi bi-pencil-fill"></i></div>
                        </div>
                    </div>

                    <div class="btn-salvar-container">
                        <button type="submit" class="btn-salvar" disabled>Salvar</button>
                        <button type="button" class="btn-logout" id="logoutButton">Sair</button>
                    </div>
                </form>

            </div>
        </main>
    </div>
    <script type="module" src="ClienteHeader.js"></script>
    <script type="module" src="ClienteEditarPerfil.js"></script>
</body>
</html>
