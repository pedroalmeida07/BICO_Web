<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Início do Cliente</title>

    <!--Links para os ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Cliente.css">
</head>
<body>
    <!-- Barra superior da página-->
    <header class="header">
        <a class="header-logo" href="#inicio" aria-label="BICO - início">
            <img src="../Icones/bico_tucan.png" alt="" class="logo-tucano">
            <img src="../Icones/bico_logo.png" alt="BICO" class="logo-nome">
        </a>

        <form id="providerSearchForm" class="search-form" role="search">
            <label class="visually-hidden" for="service-search">Pesquisar um serviço ou prestador</label>
            <input id="service-search" type="search" placeholder="Pesquisar um serviço ou prestador">
            <button type="submit" aria-label="Pesquisar"><i class="bi bi-search" aria-hidden="true"></i></button>
        </form>

        <nav class="header-nav" aria-label="Navegação principal">
            <a href="#inicio" class="nav-link active">Início</a>
            <a href="#mensagens" class="nav-link">Mensagens</a>
            <a href="#configuracoes" class="nav-link">Configurações</a>
        </nav>

        <a class="header-profile" href="#perfil">
            <img src="../Icones/Wellington_Matos.jpeg" alt="" class="profile-avatar">
            <span class="profile-name">Kleber Nunes</span>
        </a>
    </header>

    <div class="main-layout" id="inicio">
        <aside class="sidebar" aria-label="Atalhos">
            <a href="#inicio" class="sidebar-icon active" title="Página inicial" aria-label="Página inicial"><img src="../Icones/HomeLaranja.png" alt="Página Inicial"></a>
            <a href="ClienteEditarPerfil.html" class="sidebar-icon" title="Editar perfil" aria-label="Editar perfil"><img src="../Icones/UserPreto.png" alt="Editar Perfil"></a>
            <a href="#favoritos" class="sidebar-icon" title="Favoritos" aria-label="Favoritos"><img src="../Icones/StarPreto.png" alt="Favoritos"></a>
        </aside>

        <main class="content-area">
            <p id="favoriteActionMessage" class="favorite-action-message" role="status" aria-live="polite" hidden></p>
            <!-- Sessão de Melhor Avaliados -->
            <section class="section" aria-labelledby="rated-title">
                <h1 class="section-title" id="provider-results-title">Melhor Avaliados</h1>
                <div class="cards-grid" id="providerResults" aria-live="polite">
                    <p class="provider-description">Carregando prestadores...</p>
                </div>
            </section>

            <!-- Sessão de favoritos -->
            <section class="section favorites-section" id="favoritos" aria-labelledby="favorites-title">
                <div class="section-heading">
                    <h2 class="section-title" id="favorites-title">Favoritos</h2>
                    <a class="view-all" href="#todos-favoritos">Ver Todos</a>
                </div>
                <div class="cards-grid" id="favoriteResults" aria-live="polite">
                    <p class="provider-description">Carregando favoritos...</p>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="ClienteHome.js"></script>
</body>
</html>
