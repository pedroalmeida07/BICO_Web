<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Home</title>

    <!-- Links de bootstrap e css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Cliente.css">
</head>
<body>
        <!-- CABEÇALHO / HEADER -->
    <header class="header">
        <div class="header-logo">
            <img src="../Icones/bico_tucan.png" alt="Logo BICO" class="img-logo">
            <img src="../Icones/bico_logo.png" alt="Logo BICO" class="img-logo">
        </div>
        
        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="header-nav">
            <a href="#" class="nav-link active">Início</a>
            <a href="#" class="nav-link">Mensagens</a>
            <a href="#" class="nav-link">Configurações</a>
        </nav>

        <!-- PERFIL DO USUÁRIO -->
        <div class="header-profile">
            <img src="../Icones/Wellington_Matos.jpeg" alt="Welington Matos" class="profile-avatar">
            <span class="profile-name">Kleber Nunes</span>
        </div>
    </header>

  <!-- CORPO PRINCIPAL DA PÁGINA -->
    <div class="main-layout">

        <!-- BARRA LATERAL COM ÍCONES/VETORES -->
        <aside class="sidebar">
        <a href="#" class="sidebar-icon active" title="Página Inicial">
            <img src="caminho/para/icone-home.png" alt="Página Inicial">
        </a>
        <a href="#" class="sidebar-icon" title="Privacidade">
            <img src="caminho/para/icone-cadeado.png" alt="Privacidade">
        </a>
        <a href="#" class="sidebar-icon" title="Editar Perfil">
            <img src="caminho/para/icone-perfil.png" alt="Editar Perfil">
        </a>
        <a href="#" class="sidebar-icon" title="Ajuda">
            <img src="caminho/para/icone-ajuda.png" alt="Ajuda">
        </a>
        </aside>
    </div>
</body>
</html>
