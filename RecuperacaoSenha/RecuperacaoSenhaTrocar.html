<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="RecuperacaoSenha.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">

    <main class="container">
        <!-- Linha do Grid Bootstrap -->
        <div class="row align-items-center justify-content-center g-4">
            
            <!-- Lado Esquerdo: Logo BICO -->
            <div class="col-12 col-lg-6 d-flex justify-content-center">
                <div class="logo-section">
                    <img src="../Icones/bico_icone.png" alt="Logo BICO" class="img-fluid d-block">
                </div>
            </div>

            <!-- Lado Direito: Card do Formulário -->
            <div class="col-12 col-lg-6 d-flex justify-content-center">
                <div class="card card-custom border-0 p-4 p-sm-5">
                    <h2 class="card-title text-center mb-4 pb-2">Trocar Senha</h2>
                    
                    <form id="formTrocarSenha">
                        <div class="d-flex flex-column gap-4 mb-5">
                            <input id="novaSenha" type="password" class="form-control form-input" placeholder="Nova Senha">
                            <input id="confSenha" type="password" class="form-control form-input" placeholder="Confirmar Senha">
                        </div>

                        <div class="d-grid gap-3">
                            <button id="btnAvancar" type="button" class="btn btn-primary-custom py-3">Continuar</button>
                            <button id="btnVoltar" type="button" class="btn btn-secondary-custom py-3">Voltar</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Botões
        const avancar = document.getElementById("btnAvancar");
        const voltar = document.getElementById("btnVoltar");

        // Inputs
        const novaSenha = document.getElementById("novaSenha");
        const confSenha = document.getElementById("confSenha");

        // Evento de Avançar com Validação
        avancar.addEventListener("click", function () {
            if (!novaSenha.value) {
                alert("Insira a nova senha!");
            } else if (!confSenha.value) {
                alert("Confirme a nova senha!");
            } else if (confSenha.value !== novaSenha.value) {
                alert("As senhas não coincidem!");
            } else {
                try {
                    window.location.href = "../Login/Login.html";
                } catch (erro) {
                    console.error("Erro ao tentar redirecionar:", erro);
                }
            }
        });
        
        // Evento de Voltar
        voltar.addEventListener("click", function () {
            try {
                window.location.href = "RecuperacaoSenhaCodigo.html";
            } catch (erro) {
                console.error("Erro ao tentar redirecionar:", erro);
            }
        });
    </script>

</body>
</html>
