<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    <link rel="stylesheet" href="RecuperacaoSenha.css">
</head>
<body>

    <div class="container">
        <!-- Lado Esquerdo: Logo BICO -->
        <div class="logo-section">
            <img src="../Icones/bico_icone.png" alt="Logo BICO">
        </div>

        <!-- Lado Direito: Card do Formulário -->
        <div class="card">
            <h2 class="card-title">Trocar Senha</h2>
            
            <div class="input-group">
                <input id="novaSenha" type="password" class="form-input" placeholder="Nova Senha">
                <input id="confSenha" type="password" class="form-input" placeholder="Confirmar Senha">
            </div>

            <div class="button-group">
                <button id="btnAvancar" type="button" class="btn btn-primary">Continuar</button>
                <button id="btnVoltar" type="button" class="btn btn-secondary">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        // Botões
        const avancar = document.getElementById("btnAvancar");
        const voltar = document.getElementById("btnVoltar");

        // Inputs
        const novaSenha = document.getElementById("novaSenha");
        const confSenha = document.getElementById("confSenha");

        // Evento de Avançar com Validação
        avancar.addEventListener("click", function () {
            if (!novaSenha.value) {
                alert("Insira a nova senha!");
            } else {
                if (!confSenha.value) {
                    alert("Confirme a nova senha!");
                } else {
                    if (confSenha.value !== novaSenha.value) {
                        alert("As senhas não coincidem!");
                    } else {
                        try {
                            window.location.href = "RecuperacaoSenhaTrocar.html";
                        } catch (erro) {
                            console.error("Erro ao tentar redirecionar:", erro);
                        }
                    }
                }
            }
        });
        
        // Evento de Voltar
        voltar.addEventListener("click", function () {
            try {
                window.location.href = "RecuperacaoSenhaCodigo.html";
            } catch (erro) {
                console.error("Erro ao tentar redirecionar:", erro);
            }
        });

    </script>

</body>
</html>
