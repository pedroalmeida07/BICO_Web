<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    
    <!-- Links de bootstrap e css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CadastroCliente.css">

</head>
<body>

    <!-- Container flex/grid centralizado via Bootstrap + CSS -->
    <div class="container main-container">
        <div class="row align-items-center justify-content-center w-100 g-4">
            
            <!-- Lado Esquerdo: Logo BICO -->
            <div class="col-12 col-md-6 d-flex justify-content-center">
                <div class="logo-section">
                    <img src="../Icones/bico_icone.png" alt="Logo BICO" class="img-fluid">
                </div>
            </div>

            <!-- Lado Direito: Card do Formulário -->
            <div class="col-12 col-md-6 d-flex justify-content-center">
                <div class="card my-card">
                    <h2 class="card-title">Informe o E-mail e a senha para sua cona</h2>
            
            <div class="input-group-custom">
                <input id="email" type="email" class="form-input" placeholder="E-mail">
                <input id="senha" type="password" class="form-input" placeholder="Senha">
                <input id="confSenha" type="password" class="form-input" placeholder="Confirmar Senha">
            </div>

            <div class="button-group-custom">
                <button id="btnAvancar" type="button" class="btn btn-custom-primary">Avançar</button>
                <button id="btnVoltar" type="button" class="btn btn-custom-secondary">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        //Botões
        const avancar = document.getElementById("btnAvancar");
        const voltar = document.getElementById("btnVoltar");

        //Inputs
        const email = document.getElementById("email")
        const senha = document.getElementById("senha")
        const confSenha = document.getElementById("confSenha")

        voltar.addEventListener("click", function () {
            if (!email.value){
                alert("Insira um e-mail!")
            }else{
                if(!senha.value){
                    alert("Insira uma senha!")
                }else{
                    if(confSenha.value!=senha.value){
                        alert("As senhas não coincidem!")
                    }else{
                        try {
                            window.location.href = "CadastroClienteLocal.html";
                        } catch (erro) {
                            console.error("Erro ao tentar redirecionar:", erro);
                        }                        
                    }
                }
            }
        });

    </script>

</body>
</html>
