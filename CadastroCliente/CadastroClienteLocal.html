<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BICO - Cadastro</title>
    
    <!-- Links de bootstrap e css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CadastroCliente.css">

</head>
<body>

    <!-- Container flex/grid centralizado via Bootstrap + CSS -->
    <div class="container main-container">
        <div class="row align-items-center justify-content-center w-100 g-4">
            
            <!-- Lado Esquerdo: Logo BICO -->
            <div class="col-12 col-md-6 d-flex justify-content-center">
                <div class="logo-section">
                    <img src="../Icones/bico_icone.png" alt="Logo BICO" class="img-fluid">
                </div>
            </div>

            <!-- Lado Direito: Card do Formulário -->
            <div class="col-12 col-md-6 d-flex justify-content-center">
                <div class="card my-card">
                    <h2 class="card-title">Onde você mora?</h2>
            
            <div class="input-group-custom">
                <input id="cep" type="text" class="form-input" placeholder="CEP">
                <input id="telefone" type="text" class="form-input" placeholder="Telefone">
                <input id="numero" type="number" class="form-input" placeholder="Número">
                <input id="complemento" type="text" class="form-input" placeholder="Complemento (Opcional)">
            </div>

            <div class="button-group-custom">
                <button id="btnAvancar" type="button" class="btn btn-custom-primary">Avançar</button>
                <button id="btnVoltar" type="button" class="btn btn-custom-secondary">Voltar</button>
            </div>
        </div>
    </div>

    <script>

        //Botões
        const avancar = document.getElementById("btnAvancar");
        const voltar = document.getElementById("btnVoltar");

        //Inputs
        const cep = document.getElementById("cep");
        const telefone = document.getElementById("telefone");
        const numero = document.getElementById("numero");
        const complemento = document.getElementById("complemento");

        avancar.addEventListener("click", function () {
            if (!cep.value) {
                alert("Insira um CEP!");
            } else {
                if (!telefone.value) {
                    alert("Insira um telefone!");
                } else {
                    if (!numero.value) {
                        alert("Insira o número da residência!");
                    } else {
                        try {
                            window.location.href = "CadastroClienteEmail.html";
                        } catch (erro) {
                            console.error("Erro ao tentar redirecionar:", erro);
                        }
                    }
                }
            }
        });

        voltar.addEventListener("click", function () {
            try {
                window.location.href = "CadastroClienteNome.html";
            } catch (erro) {
                console.error("Erro ao tentar redirecionar:", erro);
            }
        });
    </script>

</body>
</html>
